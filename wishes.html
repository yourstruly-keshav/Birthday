<section class="sky-stage">
  <div class="aurora"></div>
  <canvas id="starsky"></canvas>
  <div class="sky-hint">
    <p class="eyebrow" id="wishes-eyebrow" style="color:var(--star)">Hover over a star</p>
    <h1>Wishes from the Universe</h1>
    <p id="wishes-desc">Every star above is whispering something for you. Move over one. Let it speak.</p>
  </div>
</section>

<div class="wish-popup" id="popup"></div>

<div style="text-align:center; padding: 40px 24px 80px; position: relative; z-index: 2;">
  <a href="lanterns.html" class="next-link" style="background: rgba(255,255,255,0.1); color:#fff; border-color: rgba(255,255,255,0.2)">Release a lantern →</a>
</div>

<script src="script.js"></script>
<script>
const WISHES = [
  "May this year surprise you in the best ways.",
  "May you discover new reasons to believe in yourself.",
  "May your favorite dreams find their way to reality.",
  "May happiness visit often and stay awhile.",
  "May your soft heart stay soft and find safe places.",
  "May you fall in love with your own life.",
  "May the right people find you.",
  "May you laugh more than you cry.",
  "May rest find you when you need it.",
  "May your courage outgrow your fear.",
  "May the world keep showing you it's worth it.",
  "May you be proud of who you're becoming.",
];

const canvas = document.getElementById("starsky");
const ctx = canvas.getContext("2d");
function fit(){canvas.width=innerWidth;canvas.height=innerHeight;}
fit(); addEventListener("resize", () => { fit(); init(); });

let stars = [];
function init() {
  stars = [];
  const count = Math.min(140, Math.floor(canvas.width * canvas.height / 9000));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.6,
      tw: Math.random() * Math.PI * 2,
      wish: WISHES[Math.floor(Math.random()*WISHES.length)]
    });
  }
}
init();

function draw(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // constellations: connect nearest
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
  for (let i = 0; i < stars.length; i++) {
    for (let j = i+1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const d = Math.hypot(dx,dy);
      if (d < 90) { ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[j].x, stars[j].y); ctx.stroke(); }
    }
  }
  stars.forEach(s => {
    s.tw += 0.04;
    const a = 0.5 + Math.sin(s.tw) * 0.4;
    ctx.globalAlpha = a;
    ctx.fillStyle = "#fff4c2";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = a * 0.3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r*3, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

const popup = document.getElementById("popup");
let timer;
function showWish(text, x, y) {
  popup.textContent = text;
  popup.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(() => popup.classList.remove("show"), 3500);
}

function pickStar(x, y) {
  let best = null, bd = 36;
  for (const s of stars) {
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
canvas.addEventListener("mousemove", e => {
  const s = pickStar(e.clientX, e.clientY);
  if (s) showWish(s.wish, e.clientX, e.clientY);
});
canvas.addEventListener("click", e => {
  const s = pickStar(e.clientX, e.clientY) || stars[Math.floor(Math.random()*stars.length)];
  showWish(s.wish);
  confettiBurst(e.clientX, e.clientY);
});

/* Mobile-friendly: instant touch + adaptive hint */
const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
if (isTouch) {
  document.getElementById("wishes-eyebrow").textContent = "Tap a star";
  document.getElementById("wishes-desc").textContent = "Every star above is whispering something for you. Tap one. Let it speak.";
}

let lastTouchT = 0;
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
}, { passive: true });
canvas.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.hypot(dx, dy) > 10) return; // scroll, not a tap
  const now = Date.now();
  if (now - lastTouchT < 400) return;
  lastTouchT = now;
  const s = pickStar(t.clientX, t.clientY) || stars[Math.floor(Math.random()*stars.length)];
  showWish(s.wish);
  confettiBurst(t.clientX, t.clientY);
}, { passive: true });
</script>
</body>
</html>
